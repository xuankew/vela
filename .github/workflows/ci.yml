name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上推了新 commit 就取消还在跑的旧 run。本地推得勤的时候，
# 把一个已经被覆盖的 commit 跑完纯属烧分钟数。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 前端 · typecheck / lint / format / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 顺序不能换：setup-node 的 `cache: pnpm` 得先能解析出 pnpm，才知道 store 在哪
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 与本地开发版本一致。pnpm 版本不在这里写，
          # 由 package.json 的 packageManager 字段单点提供，免得两边各钉一个
          node-version: 22.22.2
          cache: pnpm

      # --frozen-lockfile：lockfile 与 package.json 对不上就当场失败，
      # 而不是悄悄重新解析出一份不同的依赖树
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # 只查不改。CI 里跑 --write 会把「有人忘了格式化」变成静默通过
      - run: pnpm format:check
      - run: pnpm test
      # build 必须单独跑一遍：vite 走 rolldown，与 vitest 的解析路径不同，
      # 只有它能抓到「dev 下侥幸通过、构建期才炸」的动态 import 路径
      # （字体分片那条链全靠静态分析切 chunk，见 src/fonts/loader.ts）
      - run: pnpm build

  rust:
    name: Rust · fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # src-tauri 在 Linux 上要链 WebKitGTK。缺这些系统库的话连编译都过不去，
      # `cargo clippy --all-targets` 与 `cargo test --workspace` 都会红在链接阶段，
      # 而报错长得像代码问题，排查起来很费时间
      - name: Tauri 的 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # 钉死小版本，不跟 stable。`cargo fmt --all --check` 和 `clippy -D warnings`
      # 都是会随工具链漂移的门禁：跟 stable 意味着某天早上 CI 红了而代码一行没动，
      # 那种红只会训练人去点 re-run。升级 = 改这一行 + 本地把 fmt/clippy 重跑一遍。
      # 本地口径是 Homebrew 的 rustc 1.97.1，与这里同版本。
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # macOS 打包只在打 tag 或手动触发时跑：GitHub 上 macOS runner 按 Linux 的 10 倍计费，
  # 而 `tauri build` 是 release 全量编译（codegen-units=1 + lto=true），每次 push 都跑不值当。
  # 它验的恰好是前两个 job 验不到的东西：ad-hoc 签名、.app bundle 结构、图标与 Info.plist。
  bundle-macos:
    name: macOS · tauri build
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # beforeBuildCommand 已经是 `pnpm build`，所以这一条把前端与 Rust 一起带出来
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: vela-macos
          # bundle.targets 只有 "app"（没有 dmg），所以只有这一个路径
          path: src-tauri/target/release/bundle/macos/*.app
          # 打不出包就该红，别上传一个空 artifact 装作成功
          if-no-files-found: error
