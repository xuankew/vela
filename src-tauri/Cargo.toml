[package]
name = "vela"
version = "0.0.1"
description = "Vela - lightweight editor (M0 validation shell)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vela_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
