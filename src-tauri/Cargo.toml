[package]
name = "vela"
description = "Vela - lightweight editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "vela_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# M2-C 的事件载荷（`{ taskId, batch }` 那一类）要 derive Serialize。
# 用 workspace 里那一份：许可证已核实（MIT OR Apache-2.0），而且 Tauri 本来就带着它，
# 所以这一行不往 Cargo.lock 里加任何新东西
serde = { workspace = true }
# 粘贴图片落地（M3-A-7）要把剪贴板里的二进制字节过一遍 JSON，走 base64。
# 许可证已核实（闭源硬约束，见 PLAN.md）：base64 0.22 = MIT OR Apache-2.0。
# 用 workspace 里那一份：Tauri 本来就带着它，Cargo.lock 里 0.22.1 已经在，
# 所以这一行不往 Cargo.lock 里加任何新东西
base64 = "0.22"
# 原生「打开 / 另存为」对话框。用 JS 侧的 plugin-dialog 调用（前端本来就需要拿到路径
# 去做窗口标题、脏标记与后续保存），所以 Rust 侧只需要把插件注册进 Builder。
tauri-plugin-dialog = "2"
# M6 自动更新：Tauri updater 插件，用于检查/下载/安装新版本
tauri-plugin-updater = "2"
# 右键菜单的「删除」= 移到废纸篓（M2-B-5）。许可证已核实（闭源硬约束，见 PLAN.md）：
# trash 5.2.9 = MIT。macOS 那一侧走 objc2/cocoa-foundation，Linux 走 D-Bus 或 CLI，
# 而 CI 的 rust job 在 ubuntu 上只**编译**它——`trash::delete` 是系统调用，
# 刻意不进 vela-core（单测会把临时文件塞进开发机的真实废纸篓），见 `vela-core/src/project/ops.rs`
trash = "5.2"
# 外部改动监听（M2-G，PLAN.md §3.4「文件监听」）。许可证已核实（闭源硬约束，见 PLAN.md）：
# notify 8.2.0 = CC0-1.0，notify-debouncer-full 0.6.0 = MIT OR Apache-2.0，
# 两者的 rust-version 都是 1.77，工作区是 1.77.2。
# ⚠️ 与 `trash` 同一条理由，watcher **不进 vela-core**：一个真的 watcher 在单测里
# 既要等 FSEvents/inotify 的异步回调、又会漏文件描述符。vela-core 那一侧
# （`watcher/mod.rs`）只留「该盯哪些目录」、「两份计划之间动哪几个订阅」与
# 「一条事件算哪一种变化」三件同步的事，落地层在 `src/watcher.rs`
notify = "8.2"
notify-debouncer-full = "0.6"
# 文件 IO 的真正实现住在框架无关的 vela-core 里，这一层只是 Tauri command 适配器
vela-core = { path = "../crates/vela-core" }
# M7-2 阿里云 OSS 上传（`src/oss.rs`）：一条 HTTPS PUT + 一个 UTC 时刻串。
# 三条依赖都只把**已经在锁文件里**的东西声明成直接依赖，理由（含那句 `install_default`
# 为什么必须有 `rustls` 这一行）记在根 `Cargo.toml` 的 M7-2 那段
reqwest = { workspace = true }
rustls = { workspace = true }
time = { workspace = true }
# `tauri::generate_context!()` 宏需要 serde_json（编译期生成 tauri.conf.json 的 JSON 解析）
serde_json = { workspace = true }
# M7-8 预览里的云端图片：`img.src` 里那个路径是 `uri_encode(key, true)` 编出来的，
# 而签名要的是解码之后的对象名，所以命中判定必须百分号解码一次。生产代码里唯一一处。
# 许可证已核实（闭源硬约束，见 PLAN.md）：percent-encoding 2.3.2 = MIT OR Apache-2.0。
# 🔴 不往 Cargo.lock 里加任何新东西：它本来就在（`url` 的传递依赖，而 `url` 由 tauri 带着，
# `imgproto.rs` 已经在生产代码里用 `tauri::Url`）。M7-8 之前它只在 dev-dependencies 里声明
percent-encoding = "2"

# M7-4 AccessKeySecret 存进 macOS 钥匙串（`src/secrets.rs`）。许可证已核实（闭源硬约束，
# 见 PLAN.md）：security-framework 3.7.0 = MIT OR Apache-2.0，`license` 字段从它 `.crate`
# 包里的 `Cargo.toml.orig` 读出来。
# 🔴 不往 Cargo.lock 里加任何新东西：它本来就在（reqwest 的 rustls 走
#   `rustls-platform-verifier`，在 macOS 上就依赖这一个）。
# ⚠️ 只在 macOS 声明：`SecItemCopyMatching` 那一套是苹果的系统调用，而门禁的 rust job 在
#   ubuntu 上——那一边 `secrets.rs` 编译的是返回 `Unsupported` 的那一份桩。
# ⚠️ `rust-version` 是 1.85，比工作区声明的 1.77.2 高。与上面 `reqwest` 那一条同一个情况：
#   锁文件里那一份早就被 tauri 拉进来了，本机与 CI 的工具链都是 1.97.1。
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
# 只为了把三个搜索事件载荷的形状钉成黄金 JSON（与 `src/ipc/search.test.ts` 对照）。
# 生产代码不序列化 JSON，Tauri 自己那一份不对外露。许可证同上：MIT OR Apache-2.0
# M2-E：`ProjectIndexCache` 的缓存策略要有真的目录树才能测（见 `commands.rs` 的
# `每次_index_project_都重建`）。许可证已核实，见根 `Cargo.toml`：MIT OR Apache-2.0
tempfile = { workspace = true }

# `secrets.rs` 里那一条「手写的 OSStatus 与 sys 常量一致」的用例。生产代码用字面量
# （三条码写在一处，见那个模块的注释），所以这里只需要**验证**它们的出处。
# 许可证与上面那一条相同（MIT OR Apache-2.0），版本也早就在锁里。
[target.'cfg(target_os = "macos")'.dev-dependencies]
security-framework-sys = "2"
