[workspace]
members = ["src-tauri", "crates/vela-core"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.77.2"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# 许可证已核实（闭源硬约束，见 PLAN.md）：
#   encoding_rs = (Apache-2.0 OR MIT) AND BSD-3-Clause，全宽松
#   serde / tempfile = MIT OR Apache-2.0
#   ignore / globset / grep-searcher / grep-regex / grep-matcher = Unlicense OR MIT
#     （都是 ripgrep 那一套的库化产物，`cargo info` 逐个核过 license 字段）
#   memchr = Unlicense OR MIT（M2-H 起是 vela-core 的直接依赖；此前它已经作为
#     grep-searcher / regex 的传递依赖躺在 Cargo.lock 里，版本没变，所以没有新增下载）
#
# ⚠️ `ignore` 是个来回：M2-A 一度引入，因为「树不按 .gitignore 过滤」那个决定又摘掉了；
# M2-C 把它加回到**搜索侧**——搜索要读每个文件的正文，不过滤就等于 grep 十万个依赖文件。
# 两处的方向相反是权衡不同，不是写错了，两条测试也刻意方向相反。
encoding_rs = "0.8"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

# M2-C 全局搜索
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"

# M7-1 阿里云 OSS V4 签名。许可证已核实（闭源硬约束，见 PLAN.md）：
#   hmac 0.12.1 / sha2 0.10.9 / hex 0.4.3 全是 MIT OR Apache-2.0，三个 `license` 字段
#   都是从各自 `.crate` 包里的 `Cargo.toml.orig` 读出来的，不是凭印象写的。
# ⚠️ `sha2` 与 `hex` 本来就在 `Cargo.lock` 里（Tauri 那侧的传递依赖），所以这两行
#   不往锁文件里加任何新东西；真正新增的只有 `hmac` 一条（连带它依赖的 `digest`、
#   `crypto-common`、`generic-array`、`typenum` —— 那四条同样早就在锁里）。
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# M8-7 目录级 GitHub 同步：本地的 `path → sha` 表必须与 GitHub 回的 blob sha 同口径，
# 而 Git 的仓库对象格式是 SHA-1。许可证已核实：sha1 0.10.7 = MIT OR Apache-2.0
# （与上面的 sha2 同属 RustCrypto，`license` 字段读自 `.crate` 里的 `Cargo.toml`）。
# ⚠️ 这是本轮唯一新增的包（它依赖的 digest / cfg-if / cpufeatures 都已经在锁里）。
sha1 = "0.10"

# M7-2 OSS 上传落地层（`src-tauri/src/oss.rs`）。许可证已核实（闭源硬约束，见 PLAN.md）：
#   reqwest 0.13.5 = MIT OR Apache-2.0，time 0.3.55 = MIT OR Apache-2.0，
#   rustls 0.23.45 = Apache-2.0 OR ISC OR MIT；`license` 字段都从各自 `.crate` 包里的
#   `Cargo.toml`（reqwest 那份读的是 `Cargo.toml.orig`）读出来，不是凭印象写的。
# 🔴 三条都**不往 Cargo.lock 里加任何新东西**：reqwest 与 rustls 本来就在（tauri 核心与
#   tauri-plugin-updater 都依赖它们），time 也在（updater 依赖）。
# ⚠️ 为什么 reqwest 用 `rustls-no-provider` 而不是默认的 `default-tls`：后者等于 `rustls`，
#   而那一个会打开 `__rustls-aws-lc-rs` 把 aws-lc-rs/aws-lc-sys 拉进来——一把全新的、
#   几百 KB 的 C 密码学后端，且不在本机注册表缓存里（`--offline` 直接解析失败）。
#   本仓库的锁里 rustls 只带 `ring`（与 tauri-plugin-updater 的声明一字不差），
#   所以走「no-provider + 我们自己装 ring 的 provider」那一条，签名请求与自动更新共用同一套。
#   代价是 reqwest 在**没装 provider 时会 panic**（见 `src-tauri/src/oss.rs` 的 `client`），
#   所以 `rustls` 这一行不是可选的便利，是那一句 `install_default()` 的出处。
# ⚠️ `reqwest` 的 `rust-version` 是 1.85，比本工作区声明的 1.77.2 高。这不是新约束：
#   锁文件里那一份早就被 tauri 拉进来了，本机工具链是 1.97.1。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
time = { version = "0.3", default-features = false, features = ["std"] }

# profile 只在 workspace 根生效，写在成员包里 cargo 会直接忽略并告警
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
