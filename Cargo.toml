[workspace]
members = ["src-tauri", "crates/vela-core"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.77.2"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# 许可证已核实（闭源硬约束，见 PLAN.md）：
#   encoding_rs = (Apache-2.0 OR MIT) AND BSD-3-Clause，全宽松
#   serde / tempfile = MIT OR Apache-2.0
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

# profile 只在 workspace 根生效，写在成员包里 cargo 会直接忽略并告警
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
